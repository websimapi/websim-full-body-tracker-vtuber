<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Full Body Tracker VTuber</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Hidden video for pose estimation -->
    <video id="video" playsinline style="display: none;"></video>
    <!-- Canvas for drawing the VTuber skeleton and trailing effects -->
    <canvas id="canvas"></canvas>
    <!-- Instructions for the user -->
    <div id="instructions">
      <h1>Full Body Tracker VTuber</h1>
      <p>Raise your <strong>LEFT</strong> hand above your nose to change the background color.</p>
      <p>Raise your <strong>RIGHT</strong> hand above your nose to toggle the trailing effect.</p>
      <p id="trailing-status">Trailing: OFF</p>
    </div>
    <!-- ml5.js library for PoseNet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ml5/0.6.0/ml5.min.js"></script>
    <!-- Our main script -->
    <script type="module" src="script.js"></script>
